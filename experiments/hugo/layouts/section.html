{{ define "main" }}
<section aria-labelledby="guides-title">
  <p class="syn-eyebrow">MARKDOWN CONTENT / NO JS</p>
  <h1 id="guides-title">{{ .Title }}</h1>
  <div class="preview-content">{{ .Content }}</div>
  <div class="preview-guides" aria-label="Guides">
    {{ range .RegularPages.ByTitle }}
    <article class="syn-panel">
      <h2 class="syn-heading"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p class="syn-muted">Open the rendered Markdown documentation.</p>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
