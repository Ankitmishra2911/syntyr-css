<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default "Syntyr CSS: framework-independent, MIT-licensed styling" }}">
  <title>{{ .Title }} · Syntyr CSS (Hugo evaluation)</title>
  <link rel="stylesheet" href="{{ "dist/syntyr.core.css" | relURL }}">
  <style>
    /* Prototype-only layout. Component and theme styles are Syntyr CSS. */
    .preview-wrap { width:min(100% - 2rem, 76rem); margin:auto; padding-block:2rem 4rem; }
    .preview-nav { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; padding-bottom:1.5rem; border-bottom:1px solid var(--syn-frame); }
    .preview-nav a { color:var(--syn-accent); }
    .preview-content { max-width:76ch; overflow-wrap:anywhere; }
    .preview-content :is(pre,code) { font-family:var(--syn-mono); }
    .preview-content pre { padding:1rem; overflow-x:auto; max-width:100%; background:var(--syn-surface-hi); border:1px solid var(--syn-frame); border-radius:var(--syn-radius); }
    .preview-content code { overflow-wrap:anywhere; }
    .preview-content pre code { overflow-wrap:normal; white-space:pre; }
    .preview-content a { color:var(--syn-accent); }
    .preview-content :is(h1,h2,h3) { margin-top:1.7rem; }
    .preview-content :is(p,li) { line-height:1.7; }
    .preview-content img { max-width:100%; height:auto; }
    .preview-content table { display:block; overflow-x:auto; border-collapse:collapse; }
    .preview-content :is(th,td) { padding:.6rem; border:1px solid var(--syn-frame); }
    .preview-content blockquote { padding:.5rem 1rem; border-inline-start:3px solid var(--syn-accent); background:var(--syn-surface); margin-inline:0; }
    .preview-guides { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr)); gap:1rem; }
  </style>
</head>
<body class="syn-root syn-page" data-syn-theme="studio">
<div class="preview-wrap">
  <header class="preview-nav">
    <a class="syn-logo" href="{{ "" | relURL }}">// SYNTYR / DOCS PROTOTYPE</a>
    <nav aria-label="Site navigation">
      <a href="{{ "guide/" | relURL }}">Guides</a> ·
      <a href="https://dporkka.github.io/syntyr-css/docs/">Live gallery</a> ·
      <a href="https://github.com/dporkka/syntyr-css">MIT source</a>
    </nav>
  </header>
  <main id="main">{{ block "main" . }}{{ end }}</main>
  <footer><p class="syn-caption">STATIC HUGO EVALUATION / NOT THE PRODUCTION WEBSITE / ZERO RUNTIME JS</p></footer>
</div>
</body>
</html>
