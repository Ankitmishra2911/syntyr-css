<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntyr Geo MapLibre development fixture</title>
  <link rel="stylesheet" href="../../dist/syntyr.core.css">
  <link rel="stylesheet" href="../../dist/syntyr.geo.css">
  <style>body{margin:0;padding:12px}.syn-geo-shell{max-inline-size:1100px;margin-inline:auto}.syn-geo-viewport{--syn-geo-height:32rem}.syn-geo-sidebar a{display:inline-flex;min-block-size:44px;align-items:center}</style>
</head>
<body class="syn-root" data-syn-theme="studio">
<main class="syn-geo-shell">
  <h1>MapLibre / Syntyr Geo integration</h1>
  <div class="syn-geo-workspace">
    <aside class="syn-geo-sidebar" aria-labelledby="sites-heading">
      <h2 id="sites-heading">Available sites</h2>
      <p>Fictional test sites. Controls are wired at runtime by the browser smoke test.</p>
      <ul class="syn-geo-data-list"><li><a href="#map">Site A — active</a></li><li><a href="#map">Site B — maintenance</a></li></ul>
    </aside>
    <section class="syn-geo-viewport" aria-label="Interactive MapLibre map">
      <div id="map" class="syn-geo-map"></div>
      <div class="syn-geo-overlay">
        <div class="syn-geo-controls" role="group" aria-label="Map actions">
          <button id="geo-zoom" class="syn-geo-control" type="button" aria-label="Zoom in">+</button>
        </div>
        <div class="syn-geo-bottom">
          <div class="syn-geo-legend" role="group" aria-label="Map legend">
            <p class="syn-geo-legend-title">Sites</p>
            <ul class="syn-geo-legend-list">
              <li><span class="syn-geo-swatch" aria-hidden="true"></span>Available</li>
              <li><span class="syn-geo-swatch" data-syn-geo-kind="zone" aria-hidden="true"></span>Maintenance</li>
            </ul>
          </div>
        </div>
      </div>
      <p class="syn-geo-attribution">Offline synthetic style / no external tiles</p>
    </section>
  </div>
</main></body></html>
