# Sveltia CMS: replace this placeholder after copying the starter to your own repo.
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: REPLACE_OWNER/REPLACE_REPO
  branch: main
publish_mode: editorial_workflow
collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: content/pages/home.json
        format: json
        fields:
          - name: title
            label: SEO title
            widget: string
          - name: description
            label: Meta description
            widget: text
          - name: theme
            label: Syntyr theme
            widget: select
            options: [studio, grid, noir, industrial, terminal, corporate, minimal]
          - name: sections
            label: Page sections
            widget: list
            typeKey: type
            types:
              - name: hero
                label: Hero
                fields:
                  - { name: eyebrow, label: Eyebrow, widget: string }
                  - { name: heading, label: Heading, widget: string }
                  - { name: description, label: Description, widget: text }
                  - name: button
                    label: Button
                    widget: object
                    fields:
                      - { name: label, widget: string }
                      - { name: url, widget: string }
              - name: features
                label: Features
                fields:
                  - { name: heading, widget: string }
                  - name: items
                    label: Feature cards
                    widget: list
                    fields:
                      - { name: title, widget: string }
                      - { name: description, widget: text }
              - name: pricing
                label: Pricing
                fields:
                  - { name: heading, widget: string }
                  - name: plans
                    label: Plans
                    widget: list
                    fields:
                      - { name: name, widget: string }
                      - { name: price, widget: string }
                      - name: features
                        label: Features
                        widget: list
                        field: { name: feature, widget: string }
                      - name: button
                        widget: object
                        fields:
                          - { name: label, widget: string }
                          - { name: url, widget: string }
              - name: faq
                label: FAQ
                fields:
                  - { name: heading, widget: string }
                  - name: items
                    label: Questions
                    widget: list
                    fields:
                      - { name: question, widget: string }
                      - { name: answer, widget: text }
              - name: cta
                label: Call to action
                fields:
                  - { name: heading, widget: string }
                  - { name: description, widget: text }
                  - name: button
                    widget: object
                    fields:
                      - { name: label, widget: string }
                      - { name: url, widget: string }
