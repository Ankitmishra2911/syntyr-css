<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Syntyr data grid — static presentation example</title>
  <link rel="stylesheet" href="../dist/syntyr.core.css">
  <link rel="stylesheet" href="../dist/syntyr.data-grid.css">
</head>
<body>
<main class="syn-root syn-shell" data-syn-theme="studio" data-syn-density="compact">
  <h1>Inventory workspace</h1>
  <p>A read-only demonstration. Applications own sorting, editing, virtualization and persistence.</p>
  <section role="grid" aria-label="Inventory" aria-rowcount="3" aria-colcount="3" class="syn-data-grid">
    <div class="syn-data-grid__viewport" tabindex="0" role="region" aria-label="Scrollable inventory grid">
      <div role="rowgroup" class="syn-data-grid__header">
        <div role="row" aria-rowindex="1" class="syn-data-grid__header-row">
        <div role="columnheader" style="width:10rem" class="syn-data-grid__columnheader">Asset</div>
        <div role="columnheader" style="width:9rem" class="syn-data-grid__columnheader">Status</div>
        <div role="columnheader" style="width:8rem" class="syn-data-grid__columnheader">Revenue</div>
        </div>
      </div>
      <div role="rowgroup" style="position:relative;block-size:4rem">
        <div role="row" aria-rowindex="2" class="syn-data-grid__row" style="block-size:2rem">
          <div role="gridcell" tabindex="0" style="width:10rem" class="syn-data-grid__cell">Face 102</div>
          <div role="gridcell" tabindex="-1" style="width:9rem" class="syn-data-grid__cell" aria-selected="true">Booked</div>
          <div role="gridcell" tabindex="-1" style="width:8rem" class="syn-data-grid__cell syn-data-grid__cell--numeric">$4,200</div>
        </div>
        <div role="row" aria-rowindex="3" class="syn-data-grid__row" style="top:2rem;block-size:2rem">
          <div role="gridcell" tabindex="-1" style="width:10rem" class="syn-data-grid__cell">Face 103</div>
          <div role="gridcell" tabindex="-1" style="width:9rem" class="syn-data-grid__cell" data-syn-dirty="true">Review</div>
          <div role="gridcell" tabindex="-1" style="width:8rem" class="syn-data-grid__cell syn-data-grid__cell--numeric">$2,850</div>
        </div>
      </div>
    </div>
    <footer class="syn-data-grid__footer">2 inventory records. This example does not implement application commands.</footer>
  </section>
</main>
</body></html>
